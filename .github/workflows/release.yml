name: release
on:
  push:
    tags: ["v[0-9]*"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2022
    env:
      PORTABLE: XValkyrie-Win-x86_64-Portable.zip
      INSTALLER: XValkyrie-Win-x86_64.msi
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - run: cmake --build build --config Release --parallel 3
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: Portable archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory stage | Out-Null
          Copy-Item build/Release/xvalkyrie.exe, build/Release/xvboot.exe, LICENSE, THIRD-PARTY.md, README.md stage
          Compress-Archive -Path stage/* -DestinationPath $env:PORTABLE
      - name: Installer
        shell: pwsh
        run: |
          # Windows Installer versions are three numbers: v1.2.3-rc1 is 1.2.3
          $version = ($env:GITHUB_REF_NAME -replace '^v', '') -replace '[-+].*$', ''
          dotnet tool install --global wix --version 5.0.2
          wix build packaging/windows/installer.wxs -arch x64 -d Version=$version -d Source=stage -o $env:INSTALLER
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME $env:PORTABLE $env:INSTALLER --title "XValkyrie $env:GITHUB_REF_NAME" --generate-notes --verify-tag
